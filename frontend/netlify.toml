# Netlify: set "Base directory" = frontend (this folder). Nothing to build.
[build]
  publish = "."
  command = ""

# The browser always calls /api/v1/... on this same site.
# Netlify forwards it to the live backend on Render, so no CORS setup is needed.
[[redirects]]
  from = "/api/*"
  to = "https://somiti-kisti-agent.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
